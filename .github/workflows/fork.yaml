# The fork's own CI (docs/DECISIONS.md "The PS1 build stays byte-identical"). Upstream's build.yaml builds only in
# ReGame-Labs/dcb_decomp, whose disc repository forks can't read; its `names` job still runs here. This workflow
# builds `us` from the owner's private data checkout (gascarcella/dcb-gamedata, read through a deploy key) and checks
# every binary against the original, as upstream's build job does.
name: fork
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # Only this fork's own runs have the key; a pull request from another fork gets upstream's disc-free checks.
    if: >-
      github.repository == 'gascarcella/dcb_decomp' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    name: build (us)
    env:
      VERSION: us
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        persist-credentials: false

    # Only the two files the build reads, not the disc image.
    - uses: actions/checkout@v5
      with:
        repository: gascarcella/dcb-gamedata
        ssh-key: ${{ secrets.GAMEDATA_DEPLOY_KEY }}
        path: gamedata-checkout
        sparse-checkout: gamedata/us/disc
        persist-credentials: false

    - run: |
        mkdir -p disks/us
        cp gamedata-checkout/gamedata/us/disc/SLUS_013.28 gamedata-checkout/gamedata/us/disc/P.DRV disks/us/
        rm -rf gamedata-checkout

    - run: |
        sudo apt-get update
        sudo apt-get install -y binutils-mipsel-linux-gnu gcc-mipsel-linux-gnu

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip

    - run: pip install -r requirements.txt

    - run: tools/dl_deps.sh

    - run: |
        make generate
        make -j$(nproc)
        make compare

    # The shell scripts this fork adds parse.
    - run: for f in scripts/*.sh; do bash -n "$f"; done

  # The PC port's host-compile probe (docs/PORT.md "The host-compile probe"; issue #2) and its build: no disc, no game
  # data. The port configures from the tracked sources alone, psxstack's inventory compiles every `us` unit for the
  # host (0 diagnostics, no duplicate global), the Psy-Q declarations agree with the stack's and the shim covers every
  # call (scripts/probe.sh, a gate since M1 drove it to zero); then the port builds and links (scripts/port_build.sh).
  probe:
    runs-on: ubuntu-24.04
    name: port probe (us)
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        persist-credentials: false

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip

    - run: |
        python3 -m venv .venv
        .venv/bin/pip install cmake ninja

    - run: scripts/probe.sh

    # The port's build and link (build/port/dcb), and its version.
    - run: scripts/port_build.sh

    # The host GTE macros (port/include/gte.h) against psxstack's software GTE: gcc only, no disc.
    - run: scripts/gte_test.sh

    # The task scheduler on the host (src/main/system/task.c, port/game/tasks.c) over psxstack's fibers: gcc only.
    - run: scripts/tasks_test.sh

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: probe-summary
        path: build/port_inventory/summary.txt
        if-no-files-found: ignore

  # The emulator replays (docs/PORT.md "Testing"; issue #3): the pad scripts of tests/replay/scripts/ run in the
  # pinned PCSX-Redux from the data checkout and must give the records of tests/replay/records/. Needs the disc
  # image (rebuilt from the data checkout's xz parts) and the emulator zip, both through the deploy key, so only the
  # fork's own runs have it, as the build job. The stack's runners are the submodule's tools/replay/. Then the port
  # boots the same disc headless to OPENSEG (scripts/port_build.sh --boot) and replays boot and title against the
  # records (tests/port/run.py boot title new_game first_duel).
  replay:
    if: >-
      github.repository == 'gascarcella/dcb_decomp' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    name: emulator replays (us)
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        persist-credentials: false

    - uses: actions/checkout@v5
      with:
        repository: gascarcella/dcb-gamedata
        ssh-key: ${{ secrets.GAMEDATA_DEPLOY_KEY }}
        path: gamedata-checkout
        sparse-checkout: |
          gamedata/us
          tools/prebuilt
        persist-credentials: false

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - run: |
        python3 -m venv .venv
        .venv/bin/pip install cmake ninja

    - run: |
        export DCB_GAMEDATA="$PWD/gamedata-checkout"
        export DCB_UBUNTU_MIRROR=http://azure.archive.ubuntu.com/ubuntu   # the runners' own archive: archive.ubuntu.com stalls from them
        scripts/setup.sh disc redux
        scripts/check_emulator.sh
        .venv/bin/python tests/replay/replay.py check -j 2

    - run: scripts/port_build.sh --boot
    - run: .venv/bin/python tests/port/run.py boot title new_game first_duel first_duel_play deck_edit --sanitize
    # M2: the VRAM, textures and picture against the emulator's at every checkpoint; the known differences are in
    # tests/port/vram_known.json. No PNGs: pictures of the game stay off CI.
    - run: .venv/bin/python tests/port/vram.py -j 2 --no-png
    # M4: saves both ways: the port and the emulator each save new_game to a new card, the cards' formats, then each
    # loads the other's card (tests/saves/continue.json). The cards are made here and never uploaded (game data).
    - run: .venv/bin/python tests/saves/run.py
    # M3: LIBSND, LIBSPU and the SPU core replayed on the emulator's timeline must give the committed SPU write trace
    # (tests/sound/traces/first_duel_play.trace.gz) exactly to its known first difference, also under ASan/UBSan; the known exceptions are in
    # tests/port/sound_known.json. Then the port's own runs above against it (informational: the game's timing differs).
    - run: .venv/bin/python tests/port/sound.py --sanitize
    - run: .venv/bin/python tests/port/sound.py port

  # The desktop build (docs/PORT.md "Running it"): the window build (-DPSXSTACK_SDL=ON) and the launcher, with SDL3, DXC
  # and Dear ImGui from scripts/setup.sh sdl (psxstack's own setup at the submodule's pins, in bin/psxstack-tools/),
  # cached on those pins (psxstack/scripts/setup.sh --pins: a pin bump rebuilds them once, ~2 min). No apt: on the
  # runner SDL gets whatever backends its headers allow, and the checks run on its offscreen video and dummy audio
  # drivers. The input self-test runs without the disc (#39); the boot and the launcher's self-test need the data
  # checkout, as the replay job.
  # scripts/port_build.sh --sdl --boot: the input self-test (every default key and a virtual gamepad's buttons reach the
  # pad, hotkeys never do, the pause), then the boot in an offscreen window whose log and picture must equal the
  # headless build's; scripts/launcher_build.sh: the launcher's self-test, with the real disc and the SDL game.
  desktop:
    if: >-
      github.repository == 'gascarcella/dcb_decomp' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    name: desktop (window, launcher)
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        persist-credentials: false

    - uses: actions/checkout@v5
      with:
        repository: gascarcella/dcb-gamedata
        ssh-key: ${{ secrets.GAMEDATA_DEPLOY_KEY }}
        path: gamedata-checkout
        sparse-checkout: gamedata/us
        persist-credentials: false

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - run: |
        python3 -m venv .venv
        .venv/bin/pip install cmake ninja

    - id: pins
      run: echo "hash=$(psxstack/scripts/setup.sh --pins | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      with:
        path: |
          bin/psxstack-tools/tools/sdl3
          bin/psxstack-tools/tools/dxc
          bin/psxstack-tools/tools/imgui
        key: psxstack-tools-${{ runner.os }}-${{ steps.pins.outputs.hash }}

    - run: DCB_GAMEDATA="$PWD/gamedata-checkout" scripts/setup.sh disc sdl

    - run: scripts/port_build.sh --sdl --boot
    - run: scripts/launcher_build.sh

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: desktop-logs
        path: |
          build/port-sdl/input-test.log
          build/port-sdl/crash-*.txt
          build/launcher/self-test.log
        if-no-files-found: ignore

  # The Windows build (docs/PORT.md "Running it"; DECISIONS "Windows: cross-built from Linux with llvm-mingw, tested
  # under Wine"): the game and the launcher cross-compiled with llvm-mingw and SDL3 for Windows (scripts/setup.sh
  # windows: psxstack's own steps at the submodule's pins in bin/psxstack-tools/, cached on those pins), then under
  # Ubuntu's Wine, headless (scripts/build_windows.sh --test): the launcher's self-test with the disc and dcb.exe, the
  # game's input self-test, the boot and title replays (the emulator's cross-core view, two runs identical), and boot's
  # frame log, record and SPU trace byte-identical to the Linux headless build's. The disc comes from the data
  # checkout, as the replay job's.
  windows:
    if: >-
      github.repository == 'gascarcella/dcb_decomp' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    name: windows (cross-build, Wine)
    env:
      WINEDEBUG: "-all"
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        persist-credentials: false

    - uses: actions/checkout@v5
      with:
        repository: gascarcella/dcb-gamedata
        ssh-key: ${{ secrets.GAMEDATA_DEPLOY_KEY }}
        path: gamedata-checkout
        sparse-checkout: gamedata/us
        persist-credentials: false

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    # wine64 alone: no 32-bit multiarch (the binaries are x86_64; `wine` is the command the scripts call).
    - run: |
        python3 -m venv .venv
        .venv/bin/pip install cmake ninja
        sudo apt-get update -q
        sudo apt-get install -y -q --no-install-recommends wine wine64

    - id: pins
      run: echo "hash=$(psxstack/scripts/setup.sh --pins | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      with:
        path: |
          bin/psxstack-tools/tools/llvm-mingw
          bin/psxstack-tools/tools/sdl3-windows
          bin/psxstack-tools/tools/dxc
          bin/psxstack-tools/tools/imgui
        key: psxstack-tools-windows-${{ runner.os }}-${{ steps.pins.outputs.hash }}

    - run: DCB_GAMEDATA="$PWD/gamedata-checkout" scripts/setup.sh disc windows

    - run: |
        mkdir -p build/wine-prefix
        WINEPREFIX="$PWD/build/wine-prefix" wineboot --init
        wine --version

    - run: scripts/build_windows.sh --test
      timeout-minutes: 30

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: windows-logs
        # Not build/**: the Wine prefix's dosdevices/z: links to /, which the glob cannot walk.
        path: |
          build/port-win.*.log
          build/launcher-win.*.log
          build/port-win/input-test.log
          build/port-win/crash-*.txt
          build/launcher-win/selftest.log
          build/port-test-wine/*/*.stderr
          build/port-test-wine/*/*_crash/
          build/port-test-linux.log
        if-no-files-found: ignore
