# The fork's own CI (docs/DECISIONS.md "The PS1 build stays byte-identical"). Upstream's build.yaml builds only in
# ReGame-Labs/dcb_decomp, whose disc repository forks can't read; its `names` job still runs here. This workflow
# builds `us` from the owner's private data checkout (gascarcella/dcb-gamedata, read through a deploy key) and checks
# every binary against the original, as upstream's build job does.
name: fork
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    # Only this fork's own runs have the key; a pull request from another fork gets upstream's disc-free checks.
    if: >-
      github.repository == 'gascarcella/dcb_decomp' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    name: build (us)
    env:
      VERSION: us
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        persist-credentials: false

    # Only the two files the build reads, not the disc image.
    - uses: actions/checkout@v5
      with:
        repository: gascarcella/dcb-gamedata
        ssh-key: ${{ secrets.GAMEDATA_DEPLOY_KEY }}
        path: gamedata-checkout
        sparse-checkout: gamedata/us/disc
        persist-credentials: false

    - run: |
        mkdir -p disks/us
        cp gamedata-checkout/gamedata/us/disc/SLUS_013.28 gamedata-checkout/gamedata/us/disc/P.DRV disks/us/
        rm -rf gamedata-checkout

    - run: |
        sudo apt-get update
        sudo apt-get install -y binutils-mipsel-linux-gnu gcc-mipsel-linux-gnu

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip

    - run: pip install -r requirements.txt

    - run: tools/dl_deps.sh

    - run: |
        make generate
        make -j$(nproc)
        make compare

    # The shell scripts this fork adds parse.
    - run: for f in scripts/*.sh; do bash -n "$f"; done

  # The PC port's host-compile probe (docs/PORT.md "The host-compile probe"; issue #2): no disc, no game data. The port
  # configures from the tracked sources alone, then psxstack's inventory compiles every `us` unit for the host. The
  # job fails when the configure or the probe cannot run; the diagnostics' counts are the baseline that M1 drives to
  # zero, and they are not gated on until then (scripts/probe.sh).
  probe:
    runs-on: ubuntu-24.04
    name: port probe (us)
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        persist-credentials: false

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip

    - run: |
        python3 -m venv .venv
        .venv/bin/pip install cmake ninja

    - run: scripts/probe.sh

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: probe-summary
        path: build/port_inventory/summary.txt
        if-no-files-found: ignore

  # The emulator replays (docs/PORT.md "Testing"; issue #3): the pad scripts of tests/replay/scripts/ run in the
  # pinned PCSX-Redux from the data checkout and must give the records of tests/replay/records/. Needs the disc
  # image (rebuilt from the data checkout's xz parts) and the emulator zip, both through the deploy key, so only the
  # fork's own runs have it, as the build job. The stack's runners are psxstack's tools/replay/ (the submodule must
  # be at a tag that has them; until the pin bump the job checks the stack out at the commit that merged them,
  # psxstack 67abb63, and points PSXSTACK_DIR at it).
  replay:
    if: >-
      github.repository == 'gascarcella/dcb_decomp' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    name: emulator replays (us)
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        persist-credentials: false

    - uses: actions/checkout@v5
      with:
        repository: gascarcella/dcb-gamedata
        ssh-key: ${{ secrets.GAMEDATA_DEPLOY_KEY }}
        path: gamedata-checkout
        sparse-checkout: |
          gamedata/us
          tools/prebuilt
        persist-credentials: false

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'

    - uses: actions/checkout@v5
      with:
        repository: gascarcella/psxstack
        ref: 67abb63d26bbaaf39cdb2f28b298185ff4488a91   # the merge of psxstack #30 (tools/replay/); a full SHA: the action takes nothing shorter
        path: psxstack-main
        persist-credentials: false

    - run: python3 -m venv .venv

    - run: |
        export DCB_GAMEDATA="$PWD/gamedata-checkout" PSXSTACK_DIR="$PWD/psxstack-main"
        export DCB_UBUNTU_MIRROR=http://azure.archive.ubuntu.com/ubuntu   # the runners' own archive: archive.ubuntu.com stalls from them
        scripts/setup.sh disc redux
        scripts/check_emulator.sh
        .venv/bin/python tests/replay/replay.py check -j 2
