# The fork's CI (docs/DECISIONS.md "The PS1 build stays byte-identical", "CI: our workflows only, parallel"): the
# decompilation's name checks, the `us` build against the original, the PC port's probe, its tests against the
# emulator, the window build and the launcher, the Windows build under Wine. Laid out after dw2003recomp's ci.yml
# (docs/THIRD_PARTY.md): parallel jobs, each set up by .github/actions/setup.
#
# When it runs: on pull requests and pushes to main; a newer push to a pull request cancels the older run. The
# `changes` job sorts the changed files (scripts/ci_changes.sh): a change to documentation or to the release's own
# files only (release.yml tests those) runs `names` alone. The `ci` job always reports, the result of the whole run.
#
# The data checkout (gascarcella/dcb-gamedata: the executable, P.DRV, the disc image, the emulator) comes through the
# read-only deploy key GAMEDATA_DEPLOY_KEY; a fork's pull request has no secrets, so it gets the disc-free jobs only
# (names, probe). Nothing from it is cached or uploaded.
name: fork
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# One run per pull request (the newest push wins); pushes to main and manual runs are keyed by commit.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  # Whether the change needs the heavy jobs, and whether the data checkout is there.
  changes:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.changes.outputs.code }}
      data: ${{ steps.data.outputs.present }}
    steps:
    - uses: actions/checkout@v5
      with:
        fetch-depth: 0   # the base commit (the repository is a few MB)
        persist-credentials: false

    - name: What changed (scripts/ci_changes.sh)
      id: changes
      env:
        EVENT: ${{ github.event_name }}
        BEFORE: ${{ github.event.before }}
      run: |
        # A pull request's checkout is its merge commit: its first parent is the base it is tested against.
        if [[ "$EVENT" == pull_request ]] && git rev-parse -q --verify HEAD^2 > /dev/null; then
          scripts/ci_changes.sh --diff HEAD^1 HEAD >> "$GITHUB_OUTPUT"
        elif [[ "$EVENT" == push && ! "$BEFORE" =~ ^0*$ ]] && git cat-file -e "$BEFORE^{commit}" 2> /dev/null; then
          scripts/ci_changes.sh --diff "$BEFORE" HEAD >> "$GITHUB_OUTPUT"
        else
          scripts/ci_changes.sh --all >> "$GITHUB_OUTPUT"
        fi
        cat "$GITHUB_OUTPUT"

    - name: Is the data checkout available?
      id: data
      run: echo "present=${{ secrets.GAMEDATA_DEPLOY_KEY != '' }}" >> "$GITHUB_OUTPUT"

  # Always, disc-free, a few seconds: upstream's checks (they were its build.yaml's `names` job: every version names
  # its symbols as us does, and the README's counts of fake matches and hacks are the source's), the shell scripts
  # parse, the Python compiles.
  names:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false

    - run: python3 tools/check_names.py
    - run: python3 tools/hacks.py --check README.md
    - name: Scripts parse, Python compiles
      run: |
        for f in scripts/*.sh; do bash -n "$f"; done
        python3 -m py_compile tests/*/*.py port/tools/*.py

  # The PS1 build: `us` from the data checkout's executable and P.DRV, every binary checked against the original, as
  # upstream's build job does.
  build:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.data == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    name: build (us)
    env:
      VERSION: us
    steps:
    - uses: actions/checkout@v5
      with:
        submodules: recursive
        persist-credentials: false

    # Only the two files the build reads, not the disc image.
    - uses: actions/checkout@v5
      with:
        repository: gascarcella/dcb-gamedata
        ssh-key: ${{ secrets.GAMEDATA_DEPLOY_KEY }}
        path: gamedata-checkout
        sparse-checkout: gamedata/us/disc
        persist-credentials: false

    - run: |
        mkdir -p disks/us
        cp gamedata-checkout/gamedata/us/disc/SLUS_013.28 gamedata-checkout/gamedata/us/disc/P.DRV disks/us/
        rm -rf gamedata-checkout

    - run: |
        sudo apt-get update -q
        sudo apt-get install -y -q binutils-mipsel-linux-gnu gcc-mipsel-linux-gnu

    - uses: actions/setup-python@v6
      with:
        python-version: '3.12'
        cache: pip

    - run: pip install -r requirements.txt

    - run: tools/dl_deps.sh

    - run: |
        make generate
        make -j$(nproc)
        make compare

  # The PC port's disc-free gate (docs/PORT.md "The host-compile probe"): the configure from the tracked sources,
  # psxstack's inventory compiles every `us` unit for the host (0 diagnostics, no duplicate global), the Psy-Q
  # declarations agree with the stack's and the shim covers every call (scripts/probe.sh); the port builds and links
  # (scripts/port_build.sh); the host GTE macros and the task scheduler's tests. Runs on a fork's pull request too.
  probe:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    name: port probe (us)
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup

    - run: scripts/probe.sh
    - run: scripts/port_build.sh
    - run: scripts/gte_test.sh
    - run: scripts/tasks_test.sh

    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: probe-summary
        path: build/port_inventory/summary.txt
        if-no-files-found: ignore

  # The emulator and the port against each other (docs/PORT.md "Testing"), sharded: the longest replay scripts each get
  # a job (two shorter ones share one), the `others` shard every other script with a record (a new script lands there
  # by itself) and the checks
  # that are not per script. In each shard, per script, side by side on the runner's 4 cores (scripts/ci_parallel.sh;
  # each is single-threaded): the emulator's replay against its record (tests/replay/replay.py check), the port's
  # (tests/port/run.py --sanitize: twice identical, the cross-core view, the ASan/UBSan build with no report; then
  # tests/port/sound.py port, the port's SPU calls against the emulator's) and the VRAM and pictures (tests/port/vram.py
  # --no-png: no picture of the game leaves the runner; the known differences: tests/port/vram_known.json). A script
  # that continues another ("after", tests/replay/chain.py) runs combined from boot, so a shard needs no other's
  # output. `others` also: the emulator boots the disc (scripts/check_emulator.sh), the port boots it headless to
  # OPENSEG (scripts/port_build.sh --boot), the saves both ways (tests/saves/run.py: the cards stay on the runner) and
  # LIBSND on the emulator's SPU trace, also under ASan/UBSan (tests/port/sound.py --sanitize).
  replay:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.data == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: replay (${{ matrix.shard }})
    strategy:
      fail-fast: false
      matrix:
        # Keep SHARDED below in step with the shards named after their scripts. Measured on the runners (#68): a
        # shard's tests run ~1.7 times slower four at a time than alone; fusion's run.py --sanitize, 5.4 min, is the
        # longest single test, and the other shards are packed to finish before it.
        shard: [fusion, deck_edit, records, first_duel_play, new_game first_duel, others]
    env:
      SHARDED: fusion deck_edit records first_duel_play new_game first_duel
      SHARD: ${{ matrix.shard }}
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup
      with:
        steps: disc redux
        gamedata: |
          gamedata/us
          tools/prebuilt
        deploy-key: ${{ secrets.GAMEDATA_DEPLOY_KEY }}

    # The plain build (with the link's check; `others` also boots it) and the sanitizer build, before the tests use
    # them side by side.
    - name: The port and its sanitizer build
      run: |
        boot=""
        [[ "$SHARD" != others ]] || boot=--boot
        scripts/port_build.sh $boot
        cmake -S port -B build/port-san -G Ninja -DPSXSTACK_SANITIZE=ON > /dev/null
        cmake --build build/port-san

    - name: The tests, side by side
      run: |
        if [[ "$SHARD" == others ]]; then
          scripts=$(for f in tests/replay/records/*.json; do n=$(basename "$f" .json); [[ " $SHARDED " == *" $n "* ]] || echo "$n"; done)
        else
          scripts=$SHARD
        fi
        echo "scripts:" $scripts
        py=.venv/bin/python
        {
          for s in $scripts; do echo "$py tests/port/vram.py $s -j 1 --no-png --out build/port-vram/$s"; done
          for s in $scripts; do echo "$py tests/port/run.py $s --sanitize && $py tests/port/sound.py port $s"; done
          for s in $scripts; do echo "$py tests/replay/replay.py check tests/replay/scripts/$s.json"; done
          if [[ "$SHARD" == others ]]; then
            echo "scripts/check_emulator.sh"
            echo "$py tests/saves/run.py"
            echo "$py tests/port/sound.py --sanitize"
          fi
        } | scripts/ci_parallel.sh -j 4

  # The desktop build (docs/PORT.md "Running it"): the window build (-DPSXSTACK_SDL=ON) and the launcher, with SDL3, DXC
  # and Dear ImGui from scripts/setup.sh sdl (cached on psxstack's pins). No apt: SDL gets the backends its headers
  # allow, and the checks run on its offscreen video and dummy audio drivers. scripts/port_build.sh --sdl --boot: the
  # input self-test (without the disc, #39), then the boot in an offscreen window whose log and picture must equal the
  # headless build's; scripts/launcher_build.sh: the launcher's self-test, with the real disc and the SDL game.
  desktop:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.data == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: desktop (window, launcher)
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    - uses: ./.github/actions/setup
      with:
        steps: disc sdl
        cache: desktop
        gamedata: gamedata/us
        deploy-key: ${{ secrets.GAMEDATA_DEPLOY_KEY }}

    - run: scripts/port_build.sh --sdl --boot
    - run: scripts/launcher_build.sh

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: desktop-logs
        path: |
          build/port-sdl/input-test.log
          build/port-sdl/crash-*.txt
          build/launcher/self-test.log
        if-no-files-found: ignore

  # The Windows build (DECISIONS "Windows: cross-built from Linux with llvm-mingw, tested under Wine"): the game and the
  # launcher cross-compiled with llvm-mingw and SDL3 for Windows (scripts/setup.sh windows, cached on psxstack's pins),
  # then under Ubuntu's Wine, headless (scripts/build_windows.sh --test): the launcher's self-test with the disc and
  # dcb.exe, the game's input self-test, the boot and title replays (the emulator's cross-core view, two runs
  # identical), and boot's frame log, record and SPU trace byte-identical to the Linux headless build's.
  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true' && needs.changes.outputs.data == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    name: windows (cross-build, Wine)
    env:
      WINEDEBUG: "-all"
    steps:
    - uses: actions/checkout@v5
      with:
        persist-credentials: false
    # wine64 alone: no 32-bit multiarch (the binaries are x86_64; `wine` is the command the scripts call).
    - uses: ./.github/actions/setup
      with:
        steps: disc windows
        cache: windows
        apt: wine wine64
        gamedata: gamedata/us
        deploy-key: ${{ secrets.GAMEDATA_DEPLOY_KEY }}

    - name: Wine prefix
      run: |
        mkdir -p build/wine-prefix
        WINEPREFIX="$PWD/build/wine-prefix" wineboot --init
        wine --version

    - run: scripts/build_windows.sh --test
      timeout-minutes: 30

    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: windows-logs
        # Not build/**: the Wine prefix's dosdevices/z: links to /, which the glob cannot walk.
        path: |
          build/port-win.*.log
          build/launcher-win.*.log
          build/port-win/input-test.log
          build/port-win/crash-*.txt
          build/launcher-win/selftest.log
          build/port-test-wine/*/*.stderr
          build/port-test-wine/*/*_crash/
          build/port-test-linux.log
        if-no-files-found: ignore

  # The run's result in one check (a skipped job passes: documentation only, or a fork's pull request without the data
  # checkout); the one to require in a branch rule.
  ci:
    needs: [changes, names, build, probe, replay, desktop, windows]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: Every job passed or was skipped
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        echo "results: $RESULTS"
        for r in $RESULTS; do
          [[ "$r" == success || "$r" == skipped ]] || { echo "::error::a job ended with: $r"; exit 1; }
        done
